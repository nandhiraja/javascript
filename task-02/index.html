<!DOCTYPE html>
<html>
    <head>
        <title>Calculator Application</title>
        <link rel="stylesheet" href="./index.css">
        <meta name="viewport" content="width=device-width">
        <script src="./index.js" defer></script>

    </head>
    <body>
        <main id="container">
            <section id="heading">
                <h1>Calculator</h1>
            </section>
            <section id="result-area">

            </section>
            <section id="input-area">
                <div class="button">
                    <div id="1">1</div>
                </div>

                <div class="button">
                    <div id="2">2</div>
                </div>

                <div class="button">
                    <div id="3">3</div>
                </div>

                <div class="button">
                    <div id="/">/</div>
                </div>

                <div class="button">
                    <div id="4">4</div>
                </div>

                <div class="button">
                    <div id="5">5</div>
                </div>

                <div class="button">
                    <div id="6">6</div>
                </div>

                <div class="button">
                    <div id="*">*</div>
                </div>

                <div class="button">
                    <div id="7">7</div>
                </div>

                <div class="button">
                    <div id="8">8</div>
                </div>

                <div class="button">
                    <div id="9">9</div>
                </div>


                <div class="button">
                    <div id="+">+</div>
                </div>

                 <div class="button">
                    <div id="0">0</div>
                </div>

                 <div class="button">
                    <div id="ans">Ans</div>
                </div>

                 <div class="button">
                    <div id="-">-</div>
                </div>
                
            </section>


        </main>
    </body>

</html>

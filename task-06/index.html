<!DOCTYPE html>
<html>
    <head>
        <title>Drag and Drop List Reordering</title>
        <link rel="stylesheet" href="./index.css">
        <meta name="viewport" content="width=device-width">
        <script src="./index.js" defer></script>

    </head>
    <body>
        <header>
            <h2>Taks</h2>
        </header>
        <aside>
            <div class="sidebar active"> Tasks</div>
            <div class="sidebar"> My Learnings</div>
            <div class="sidebar"> My profile</div>

        </aside>
        <section id="drag-area">
            <label for="add-task">
            <input type="text" id='add-task' placeholder="Add Tasks">
            <button>Add</button>
            </label>
            <div class="container">
                <div class="list dragable" draggable="true">1.Complete JS</div>
                <div class="list dragable" draggable="true">2.Read Books </div>
                <div class="list dragable" draggable="true">3.Atten Funtion</div>
                <div class="list dragable" draggable="true">4.Buy Food</div>
                <div class="list dragable" draggable="true">5.Meet VP</div>
            </div>
        </section>

    
        
    </body>

</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Dynamic Quiz Application</title>
        <link rel="stylesheet" href="./index.css">
        <meta name="viewport" content="width=device-width">
        <script src="./index.js" defer></script>

    </head>
    <body>
        <header>
            <h2>Quiz Time</h2>
        </header>

    
        <section id="quiz-area">            
            
            <div class="question-area">
                <div class="question">Which all are scripting Language</div>        
            </div>

            <div class="options-area">
                <div class="option">
                    
                    <label class="incorrect" for="1">
                       <input type='radio' name='option' id="1">HTML 
                    </label>

                    <label class="correct" for="2">
                       <input type='radio' name='option' id="2">CSS 
                    </label>

                    <label class="incorrect" for="3">
                       <input type='radio' name='option' id="3">Java 
                    </label>

                    <label class="incorrect" for="4">
                       <input type='radio' name='option' id="4">C++ 
                    </label>

                   
                </div>

            </div>

            

            

        </section>
        <section id="submit-button">
                <button onclick=handleClick()>Next</button>
        </section>
    </body>

</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Dynamic Quiz Application</title>
        <link rel="stylesheet" href="./index.css">
        <meta name="viewport" content="width=device-width">
        <script src="./index.js" defer></script>

    </head>
    <body>
        <header>
            <h2>Quiz Time</h2>
        </header>

    
        <section id="quiz-area">            
            
            <div class="question-area">
                <div id="question"></div>        
            </div>

            <div id="options-area">
                <div id="option">
                    
                    <label  id='opt-1' for="1" >
                       <input class="input"  type='radio' name='option' id="1">
                       <span></span> 
                    </label>

                    <label id='opt-2' for="2">
                       <input class="input" type='radio' name='option' id="2">
                       <span></span> 
                    </label>

                    <label  id='opt-3' for="3">
                       <input class="input" type='radio' name='option' id="3">
                       <span></span> 
                    </label>

                    <label  id='opt-4' for="4">
                       <input class="input" type='radio' name='option' id="4">
                       <span></span> 
                    </label>

                   
                </div>

                <div id ='result'>

                </div>

            </div>

            

            

        </section>
        <section id="submit-button">
                <button id='next-btn' onclick=handleOnClick()>Next</button>
        </section>
    </body>

</html>

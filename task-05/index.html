<!DOCTYPE html>
<html>
    <head>
        <title>Dynamic Quiz Application</title>
        <link rel="stylesheet" href="./index.css">
        <meta name="viewport" content="width=device-width">
        <script src="./index.js" defer></script>

    </head>
    <body>
        <header>
            <h2>Quiz play</h2>
        </header>

    
        <section id="quiz-area">
            
            <div class="question-area">
                <div class="question">Which all are scripting Language</div>
        
            </div>
            <div class="options-area">
                <div class="option">
                    
                    <label for="1">
                       <input type='radio' name='option' class="1" id="1">HTML 
                    </label>

                    <label for="2">
                       <input type='radio' name='option' class="1" id="2">css 
                    </label>

                    <label for="3">
                       <input type='radio' name='option' class="1" id="3">java 
                    </label>

                    <label for="4">
                       <input type='radio' name='option' class="1" id="4">c++ 
                    </label>

                   
                </div>
            </div>

            

        </section>
    </body>

</html>

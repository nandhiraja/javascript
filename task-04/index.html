<!DOCTYPE html>
<html>
    <head>
        <title>Weather Application</title>
        <link rel="stylesheet" href="./index.css">
        <meta name="viewport" content="width=device-width">
        <script type='module' src="./index.js" defer></script>
        <script type="module" src="./env.js" defer></script>


    </head>
    <body>
        <main id="container">
            <section id="heading">
                <h1>Weather App</h1>
            </section>
            <section id="input-area">
                <input  id='input' type="text" placeholder="Enter City Name">
                <button id='send'>Get</button>
            </section>         

        </main>

         <section id="result-area">
            <div id="meta-details"> 
               

            
            <div class='details card'>
            <div class="details label">City</div>
            <div class="result" id="city">Erode</div>
            </div>

            
            <div class='details card'>
            <div class="details label">State</div>
            <div class="result" id="state">Tamilnadu</div>
            </div>

            
            <div class='details card'>
            <div class="details label">Country</div>
            <div class="result" id="country">India</div>
            </div>

            
            <div class='details card'>
            <div class="details label">Local Time</div>
            <div class="result" id="local-time">10:40 pm</div>
            </div>
            
          
            </div>

            <div  id="weather-report">

            <div class='card'>
            <div class="label">Condition</div>
            <div class="result" id="condition">cloudy</div>
            </div>

          

            <div class='card'>
            <div class="label">Humidity</div>
            <div class="result" id="humidity">89 %</div>
            </div>


            <div class='card'>
            <div class="label">Temp</div>
            <div class="result" id="temperature">20 °C </div>
            </div>

            <div class='card'>
            <div class="label">Pressure</div>
            <div class="result" id="pressure">90 hPa</div>
            </div>

            <div class='card'>
            <div class="label">Wind-Speed</div>
            <div class="result" id="wind-speed">45 m/s w</div>
            </div>
           
            


            </div>
        </section>
    </body>

</html>
